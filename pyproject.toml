[project]
name = "agent-smith"
version = "0.1.0"
description = "Autonomous agentic framework solving MBPP and SWE-bench tasks through a Thought -> Code -> Observation loop."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "mcp>=1.0",
]

# `uv run sandbox` -> interactive sandbox REPL (subject V.2.1).
[project.scripts]
sandbox = "agent_smith.sandbox.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `agent_mbpp` and `agent_swebench` are top-level modules so the subject's
# `uv run python -m agent_mbpp` / `-m agent_swebench` invocations resolve.
[tool.hatch.build.targets.wheel]
packages = ["src/agent_smith", "src/agent_mbpp", "src/agent_swebench"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
